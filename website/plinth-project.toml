[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Compartments"
description = "Groups workspace members into LOC-bounded partitions, keeping very large crates apart from clusters of smaller ones so one review pass stays a deliberate size."

[[pages.sections.features]]
title = "Overlap tiles"
description = "Builds analysis units for dependencies that cross a compartment boundary, so the interface between two partitions is visible instead of being cut in half."

[[pages.sections.features]]
title = "Connectivity tiles"
description = "Runs agglomerative clustering over crate dependency edges to point at likely duplication and DRY relationships across crate boundaries."

[[pages.sections.features]]
title = "Connectome and JSON"
description = "Emits the whole workspace dependency graph as named directed edges, and a JSON mode lets another tool consume the layout instead of parsing text."

[[pages.sections]]
type = "install"
id = "install"
heading = "Install"
intro = "Install the cargo subcommand from crates.io, then run it in the workspace you want to decompose. Thresholds and JSON output are flags on the same command."
guide_href = "https://github.com/caniko/cargo-crosscut"

[[pages.sections.primary_routes]]
